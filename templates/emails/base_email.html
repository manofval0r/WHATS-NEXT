<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject|default:"WHATS-NEXT" }}</title>
</head>
<body style="margin:0;padding:0;background:#0d0f12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0f12;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#15181d;border:1px solid #24282f;border-radius:12px;overflow:hidden;">

          <tr>
            <td style="padding:20px 28px;border-bottom:1px solid #24282f;">
              <span style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#ff8a3d;font-weight:600;">WHATS-NEXT</span>
            </td>
          </tr>

          <tr>
            <td style="padding:28px;color:#e6e8eb;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding:20px 28px;border-top:1px solid #24282f;">
              <a href="{{ app_url }}"
                 style="display:inline-block;background:#ff8a3d;color:#0d0f12;font-weight:600;font-size:14px;padding:11px 22px;border-radius:8px;text-decoration:none;">
                Open WHATS-NEXT
              </a>
              <p style="margin:16px 0 0;font-size:12px;color:#6b7280;">
                You are receiving this because you have email notifications on.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
